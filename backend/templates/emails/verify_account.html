<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your account</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F8F9FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
    
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8F9FA; padding: 40px 20px;">
        <tr>
            <td align="center">
                
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            
                            <h1 style="color: #202124; font-size: 24px; font-weight: 600; margin: 0 0 20px 0;">
                                Welcome to our app!
                            </h1>
                            
                            <p style="color: #5F6368; font-size: 16px; line-height: 1.6; margin: 0 0 35px 0; text-align: left;">
                                Hello,<br><br>
                                Please verify your account to get started. Click the button below to confirm your email address.
                            </p>
                            
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding: 10px 0 35px 0;">
                                        <a href="{{ auth_url }}" 
                                           style="background-color: #DF8C38; border: 14px solid #DF8C38; border-radius: 8px; color: #FFFFFF; display: inline-block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none;">
                                            Verify My Account
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            
                            <div style="border-top: 1px solid #E8EAED; padding-top: 25px; margin-top: 10px; text-align: left;">
                                <p style="color: #70757A; font-size: 13px; line-height: 1.5; margin: 0 0 15px 0;">
                                    If the button doesn't work, copy and paste this link into your browser:<br>
                                    <a href="{{ auth_url }}" style="color: #DF8C38; text-decoration: none; word-break: break-all;">{{ auth_url }}</a>
                                </p>
                                <p style="color: #9AA0A6; font-size: 12px; margin: 0;">
                                    If you did not request this, please ignore this email.
                                </p>
                            </div>
                            
                        </td>
                    </tr>
                </table>
                
            </td>
        </tr>
    </table>
    
</body>
</html>
